<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B3A · Catch the next bus</title>
<meta name="description" content="A one-screen poster for the B3A live arrivals board.">
<style>
  :root {
    color-scheme: dark;
    --ink: #090e1c;
    --cream: #f4efe4;
    --muted: #93a0c0;
    --amber: #ffb020;
    --green: #35d49a;
    --line: rgba(244, 239, 228, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    overflow: hidden;
    background:
      radial-gradient(120% 100% at 100% 0%, rgba(255, 176, 32, 0.17), transparent 55%),
      radial-gradient(95% 90% at 0% 100%, rgba(48, 78, 150, 0.38), transparent 62%),
      var(--ink);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
      "PingFang HK", "Noto Sans HK", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .poster {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1180px;
    padding: clamp(22px, 4.4vmin, 58px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: clamp(18px, 4vh, 44px);
  }

  /* LED-board texture, drawn with gradients rather than an image. */
  .poster::before {
    content: "";
    position: absolute;
    top: clamp(16px, 3vmin, 42px);
    right: clamp(16px, 3vmin, 42px);
    width: clamp(100px, 17vw, 210px);
    height: clamp(46px, 7.5vw, 86px);
    background-image: radial-gradient(circle, rgba(255, 176, 32, 0.55) 1.3px, transparent 1.9px);
    background-size: clamp(10px, 1.1vw, 14px) clamp(10px, 1.1vw, 14px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%, #000 72%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 40%, #000 72%, transparent);
    opacity: 0.6;
    pointer-events: none;
  }

  /* Oversized B3A watermark. */
  .poster::after {
    content: "B3A";
    position: absolute;
    right: -0.04em;
    bottom: -0.16em;
    z-index: -1;
    font-size: clamp(180px, 44vmin, 560px);
    font-weight: 800;
    line-height: 0.7;
    letter-spacing: -0.07em;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(244, 239, 228, 0.07);
    pointer-events: none;
  }

  .top {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.4vmin, 28px);
    flex-wrap: wrap;
    padding-right: clamp(0px, 12vw, 190px);
  }

  .badge {
    display: inline-block;
    background: var(--amber);
    color: #1a1200;
    font-size: clamp(28px, 4.8vmin, 54px);
    font-weight: 900;
    letter-spacing: 0.01em;
    line-height: 1;
    padding: clamp(5px, 1vmin, 10px) clamp(12px, 2vmin, 22px);
    border-radius: clamp(8px, 1.6vmin, 16px);
    box-shadow: 0 12px 44px rgba(255, 176, 32, 0.24);
    transform: rotate(-1.5deg);
  }

  .route {
    margin: 0;
    max-width: 30ch;
    font-size: clamp(9.5px, 1.5vmin, 13px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.75;
  }
  .route b {
    display: block;
    color: var(--cream);
    font-weight: 650;
  }

  .mid {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(14px, 2.6vmin, 30px);
  }

  h1 {
    margin: 0;
    max-width: 12ch;
    font-size: clamp(40px, 9.5vmin, 110px);
    line-height: 0.92;
    letter-spacing: -0.045em;
    font-weight: 800;
    text-wrap: balance;
  }
  h1 em {
    font-style: normal;
    color: var(--amber);
  }

  .pitch {
    margin: 0;
    max-width: 34ch;
    font-size: clamp(15px, 2.4vmin, 25px);
    line-height: 1.5;
    color: #c9d1e6;
  }

  .bottom {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(10px, 1.8vmin, 16px);
  }

  .link {
    display: inline-flex;
    align-items: center;
    gap: clamp(12px, 2vmin, 22px);
    max-width: 100%;
    padding: clamp(12px, 1.8vmin, 20px) clamp(16px, 2.4vmin, 28px);
    background: rgba(255, 176, 32, 0.09);
    border: 1px solid rgba(255, 176, 32, 0.4);
    border-radius: clamp(12px, 2vmin, 18px);
    color: var(--cream);
    text-decoration: none;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  .link:hover { background: rgba(255, 176, 32, 0.16); transform: translateY(-2px); }
  .link:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }

  .link-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

  .link-label {
    font-size: clamp(9.5px, 1.4vmin, 12px);
    font-weight: 750;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
  }

  .link-url {
    font-size: clamp(13px, 2vmin, 19px);
    font-weight: 650;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }

  .arrow {
    flex: none;
    display: grid;
    place-items: center;
    width: clamp(34px, 4.6vmin, 48px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--amber);
    color: #1a1200;
    font-size: clamp(16px, 2.2vmin, 22px);
    font-weight: 800;
  }

  .note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: clamp(9px, 1.3vmin, 11px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 9px var(--green);
  }

  @media (max-width: 560px) {
    .poster::before { display: none; }
    .top { padding-right: 0; }
  }
  @media (max-height: 420px) {
    .poster { gap: 12px; }
    h1 { font-size: clamp(30px, 8.4vmin, 58px); }
    .pitch { font-size: 14px; }
    .note { display: none; }
  }
</style>
</head>
<body>
<main class="poster">
  <header class="top">
    <span class="badge">B3A</span>
    <p class="route">
      <b>Citybus · 城巴</b>
      Fu Tai Estate ⇄ Shenzhen Bay Port
    </p>
  </header>

  <section class="mid">
    <h1>Catch the <em>next B3A.</em></h1>
    <p class="pitch">Check the live board before you leave Fu Tai Estate.</p>
  </section>

  <footer class="bottom">
    <a class="link" href="https://jiahanlyu1223-max.github.io/b3a-live/" target="_blank" rel="noopener">
      <span class="link-copy">
        <span class="link-label">Open the live board</span>
        <span class="link-url">jiahanlyu1223-max.github.io/b3a-live</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
    <p class="note"><span class="live" aria-hidden="true"></span>LIVE ETA · 繁 / 简 / EN · OFFLINE READY</p>
  </footer>
</main>
</body>
</html>
