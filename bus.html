<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3A · Fu Tai Estate → Shenzhen Bay Port</title>
<style>
  :root {
    --bg: #0d1220;
    --card: #161d31;
    --card2: #1d2742;
    --text: #eef2ff;
    --muted: #93a0c0;
    --accent: #ffb020;
    --green: #35d49a;
    --red: #ff6b6b;
    --line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, #1b2444 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK",
                 "Noto Sans HK", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .wrap { width: 100%; max-width: 560px; }
  header { margin-bottom: 16px; }
  .badge {
    display: inline-block; background: var(--accent); color: #1a1200;
    font-weight: 800; font-size: 22px; padding: 4px 12px; border-radius: 10px;
    letter-spacing: 1px;
  }
  h1 { font-size: 22px; margin: 12px 0 4px; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .sub b { color: var(--text); font-weight: 600; }
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 14px 0 12px; font-size: 13px; color: var(--muted);
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: var(--muted); margin-right: 6px; vertical-align: -1px; }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .ring { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
          border: 2px solid var(--muted); border-top-color: transparent;
          margin-right: 6px; vertical-align: -1px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button {
    background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #26325a; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; display: flex; align-items: center; gap: 16px;
  }
  li.next { border-color: rgba(255,176,32,.55);
            box-shadow: 0 0 0 1px rgba(255,176,32,.25), 0 8px 24px rgba(0,0,0,.35); }
  .mins { font-size: 40px; font-weight: 800; line-height: 1; min-width: 92px;
          text-align: center; font-variant-numeric: tabular-nums; }
  .mins small { font-size: 15px; font-weight: 600; color: var(--muted); display: block; margin-top: 4px; }
  .mins.due { color: var(--green); }
  .meta { flex: 1; }
  .meta .dest { font-weight: 700; font-size: 16px; }
  .meta .clock { color: var(--muted); font-size: 13px; margin-top: 4px;
                 font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .6px;
         background: rgba(255,176,32,.16); color: var(--accent);
         border: 1px solid rgba(255,176,32,.4); border-radius: 999px;
         padding: 2px 8px; margin-left: 8px; vertical-align: 2px; }
  .empty, .error {
    background: var(--card); border: 1px dashed var(--line); border-radius: 14px;
    padding: 28px 18px; text-align: center; color: var(--muted); font-size: 15px;
    line-height: 1.6;
  }
  .error { border-color: rgba(255,107,107,.5); color: #ffb3b3; }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">B3A</span>
    <h1>Fu Tai Estate → Shenzhen Bay Port</h1>
    <div class="sub">
      <b>Fu Tai Estate</b> <span id="stopName">(Castle Peak Road)</span><br>
      Citybus · 城巴 · towards <b>深圳灣口岸 Shenzhen Bay Port</b>
    </div>
  </header>

  <div class="statusbar">
    <div><span class="dot" id="statusDot"></span><span id="statusText">Loading…</span></div>
    <button id="refreshBtn" type="button">Refresh now</button>
  </div>

  <ul id="list"><li><div class="mins"><span class="ring"></span></div><div class="meta">Fetching next departures…</div></li></ul>

  <footer>
    Auto-refreshes every 30 seconds · Source: DATA.GOV.HK Citybus real-time ETA
    (rt.data.gov.hk). Times shown are estimates from the operator.
  </footer>
</div>

<script>
"use strict";

const CO = "CTB", ROUTE = "B3A", STOP = "003261"; // Fu Tai Estate, outbound (to Shenzhen Bay Port)
const API = "https://rt.data.gov.hk/v2/transport/citybus";
const REFRESH_MS = 30 * 1000;

const listEl = document.getElementById("list");
const dotEl = document.getElementById("statusDot");
const statusEl = document.getElementById("statusText");
const stopNameEl = document.getElementById("stopName");

let countdownTimer = null;
let etas = [];            // [{eta: Date, dest: string, etaSeq: number, rmk: string}]
let lastUpdated = null;

function setStatus(kind, text) {
  dotEl.className = "dot" + (kind ? " " + kind : "");
  statusEl.textContent = text;
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
  return res.json();
}

function minutesUntil(iso, now) {
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return null;
  return Math.max(0, Math.round((t - now.getTime()) / 60000));
}

function fmtClock(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "—";
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}

function render() {
  const now = new Date();
  const upcoming = etas
    .map(e => ({ ...e, mins: minutesUntil(e.eta, now) }))
    .filter(e => e.mins !== null)
    .sort((a, b) => new Date(a.eta) - new Date(b.eta));

  if (!upcoming.length) {
    listEl.innerHTML = '<div class="empty">No upcoming B3A buses from Fu Tai Estate ' +
      'right now.<br>The page keeps checking every 30 seconds.</div>';
    return;
  }

  listEl.innerHTML = upcoming.map((e, i) => {
    const due = e.mins <= 1;
    const minsLabel = due ? "Due" : String(e.mins);
    const unit = due ? "" : (e.mins === 1 ? "minute" : "minutes");
    return '<li' + (i === 0 ? ' class="next"' : '') + '>' +
      '<div class="mins' + (due ? " due" : "") + '">' + minsLabel +
        '<small>' + unit + '</small></div>' +
      '<div class="meta">' +
        '<div class="dest">→ ' + escapeHtml(e.dest) +
          (i === 0 ? '<span class="tag">NEXT</span>' : '') + '</div>' +
        '<div class="clock">Arrives ' + fmtClock(e.eta) +
          (e.rmk ? ' · ' + escapeHtml(e.rmk) : '') + '</div>' +
      '</div></li>';
  }).join("");
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadMeta() {
  try {
    const [route, stop] = await Promise.all([
      fetchJSON(API + "/route/" + CO + "/" + ROUTE),
      fetchJSON(API + "/stop/" + STOP)
    ]);
    if (stop && stop.data && stop.data.name_en) {
      // "Fu Tai Estate, Castle Peak Road" → "(Castle Peak Road)"
      const full = stop.data.name_en;
      const detail = full.startsWith("Fu Tai Estate,")
        ? full.slice("Fu Tai Estate,".length).trim() : full;
      stopNameEl.textContent = "(" + detail + ")";
    }
    if (route && route.data) document.title = ROUTE + " · " +
      route.data.orig_en + " → " + route.data.dest_en;
  } catch (_) { /* meta is optional */ }
}

async function refresh() {
  try {
    const json = await fetchJSON(API + "/eta/" + CO + "/" + STOP + "/" + ROUTE);
    const rows = (json.data || []).filter(r => r && r.eta && r.dir !== "I");
    etas = rows.map(r => ({
      eta: r.eta,
      dest: r.dest_en || r.dest_tc || "",
      etaSeq: r.eta_seq,
      rmk: r.rmk_en || r.rmk_tc || ""
    }));
    lastUpdated = new Date();
    setStatus("ok", "Live · updated " + lastUpdated.toLocaleTimeString([], { hour12: false }));
    render();
  } catch (err) {
    setStatus("err", "Update failed — retrying in 30s (" + err.message + ")");
    render();
  }
}

function startTimers() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(render, 5000); // keep the minute counts honest between fetches
  setInterval(refresh, REFRESH_MS);
}

document.getElementById("refreshBtn").addEventListener("click", refresh);

loadMeta();
refresh();
startTimers();
</script>
</body>
</html>
